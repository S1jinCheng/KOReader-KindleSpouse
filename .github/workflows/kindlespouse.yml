name: KindleSpouse Scribe

on:
  push:
    branches: [codex/kindlespouse-scribe, main, 'codex/improvement-**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check pinned core and approved paths
        run: |
          git fetch --depth=1 https://github.com/koreader/koreader.git 9192014d8bd82a91dc1012473be0f238dedfdb54
          python3 kindlespouse/check_scope.py
          python3 kindlespouse/check_source.py
      - name: Lint plugin modules
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check
          luacheck plugins/kindlespouse.koplugin --config .luacheckrc
      - name: Build verified home and font package
        run: python3 kindlespouse/build.py
      - name: Fetch pinned KOReader runtime
        run: |
          mkdir -p kindlespouse/build/runtime
          cd kindlespouse/build/runtime
          curl --fail --location --retry 3 --output koreader.AppImage https://github.com/koreader/koreader/releases/download/v2026.07.1/koreader-v2026.07.1-x86_64.AppImage
          printf '%s  %s\n' e60ed106cf4e824d50394a259b3aa6c46fb1daee189df73a1734e5732b5dc245 koreader.AppImage | sha256sum --check
          chmod +x koreader.AppImage
          ./koreader.AppImage --appimage-extract >/dev/null
      - name: Verify annotation and patch contracts
        run: |
          python3 kindlespouse/test_plugin.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader --test annotation
          python3 kindlespouse/test_plugin.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader --test patches
      - name: Verify compact highlight actions
        run: python3 kindlespouse/test_reader.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader --fonts kindlespouse/build/cache --feature highlight --integrated
      - name: Verify loaded reading toolbar and optional statistics
        run: python3 kindlespouse/test_reader.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader --fonts kindlespouse/build/cache --feature all --statistics --integrated
      - name: Verify compatibility and lifecycle fallback
        run: |
          python3 kindlespouse/test_plugin.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader --test main_lifecycle
          python3 kindlespouse/test_version_guard.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader
          python3 kindlespouse/test_home_guard.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader --fonts kindlespouse/build/cache
      - name: Verify localized UI and native status dialog
        run: |
          python3 kindlespouse/check_i18n.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader --all-ui
          python3 kindlespouse/test_plugin.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader --test services
      - name: Verify loaded plugin in both languages
        run: |
          python3 kindlespouse/test_home.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader --integrated --language en
          python3 kindlespouse/test_home.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader --integrated --language zh_CN
      - name: Verify scheduler and launcher contracts
        run: |
          python3 kindlespouse/test_plugin.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader --test scheduler
          python3 kindlespouse/test_plugin.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader --test launcher
          python3 kindlespouse/test_plugin.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader --test scheduler_integration
      - name: Verify 500-book asynchronous catalog
        run: python3 kindlespouse/test_catalog.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader
      - name: Verify native home and Chinese fonts
        run: python3 kindlespouse/test_home.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader
      - name: Verify the extracted installation package
        run: python3 kindlespouse/test_home.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader --package kindlespouse/build/KindleSpouse-Scribe-Overlay.zip --language zh_CN
      - name: Verify 500-book local shelf and reader return
        run: python3 kindlespouse/test_home.py --runtime kindlespouse/build/runtime/squashfs-root/usr/lib/koreader --scale
      - uses: actions/upload-artifact@v7
        with:
          name: KindleSpouse-Scribe-Preview
          path: |
            kindlespouse/build/KindleSpouse-Scribe-Overlay.zip
            kindlespouse/build/KindleSpouse-Scribe-Overlay.zip.sha256
            kindlespouse/build/artifacts/**/*.png
            kindlespouse/build/artifacts/*.png
            kindlespouse/build/test/runtime.log
            kindlespouse/build/test500/runtime.log
            kindlespouse/build/checks/**/runtime.log
            kindlespouse/build/integrated-*/runtime.log
          if-no-files-found: error
